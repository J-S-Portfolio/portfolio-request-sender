spring.application.name=portfolio_request_sender

# Server configurations
server.address=0.0.0.0
server.port=${PORT:8080}

# Request sender
# Add a new URL to this list to start pinging it. No code changes needed.
application.request-sender.urls=\
  https://javidsadigli.onrender.com/test-server,\
  https://fireflies-hyvj.onrender.com/ping

# How often to send requests (milliseconds)
application.request-sender.interval=60000
# Timeouts per request (Render cold starts can be slow)
application.request-sender.connect-timeout=10s
application.request-sender.read-timeout=60s
